services:
  database:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - goonginga_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      PORT: 3000
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${GOON_API_BIND_ADDRESS:-0.0.0.0}:${GOON_API_PORT:-3000}:3000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Set NEXT_PUBLIC_API_BASE_URL in .env}
    depends_on:
      - backend
    env_file:
      - frontend/.env
    restart: unless-stopped
    ports:
      - "${GOON_FRONTEND_BIND_ADDRESS:-0.0.0.0}:${GOON_FRONTEND_PORT:-3001}:3001"

volumes:
  goonginga_postgres_data:
