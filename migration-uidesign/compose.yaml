services:
  database:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - goonginga_postgres_data:/var/lib/postgresql
      - ../backend-springboot/src/main/resources/db/public-bootstrap.sql:/docker-entrypoint-initdb.d/001-public-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    image: ${GOON_SPRING_IMAGE:-goonginga-spring:latest}
    build:
      context: ..
      dockerfile: backend-springboot/Dockerfile
    env_file:
      - backend/.env
    volumes:
      - ./media:/app/uploads
    environment:
      PORT: 3000
      MEDIA_DIR: /app/uploads
      NODE_ENV: production
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      DRAFT_FLYWAY_ENABLED: "true"
      DRAFT_CORS_ORIGINS: https://${GOON_DOMAIN},https://${GOON_GAMENIGHTS_DOMAIN}
      APP_URL: https://${GOON_DOMAIN}/backend
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/health/db"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 768m
    ports:
      - "${GOON_API_BIND_ADDRESS:-127.0.0.1}:${GOON_API_PORT:-3000}:3000"

  frontend:
    group_add: ["10001"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Set NEXT_PUBLIC_API_BASE_URL in .env}
        NEXT_PUBLIC_MINIGAMES_FRONTEND_URL: https://${GOON_GAMENIGHTS_DOMAIN:?Set GOON_GAMENIGHTS_DOMAIN in .env}
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - frontend/.env
    environment:
      MEDIA_DIR: /app/uploads
      UPLOAD_AUTH_API_BASE_URL: http://backend:3000
    volumes:
      - ./media:/app/uploads
    restart: unless-stopped
    ports:
      - "${GOON_FRONTEND_BIND_ADDRESS:-127.0.0.1}:${GOON_FRONTEND_PORT:-3001}:3001"

  minigames:
    build:
      context: .
      dockerfile: minigames-frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_MINIGAMES_API_BASE_URL:?Set NEXT_PUBLIC_MINIGAMES_API_BASE_URL in .env}
        NEXT_PUBLIC_GOONGINGA_URL: https://${GOON_DOMAIN:?Set GOON_DOMAIN in .env}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      GOON_DOMAIN: ${GOON_DOMAIN:?Set GOON_DOMAIN in .env}
      GOON_GAMENIGHTS_DOMAIN: ${GOON_GAMENIGHTS_DOMAIN:?Set GOON_GAMENIGHTS_DOMAIN in .env}
    depends_on:
      - backend
      - frontend
      - minigames
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - goonginga_caddy_data:/data
      - goonginga_caddy_config:/config
    restart: unless-stopped

volumes:
  goonginga_postgres_data:
  goonginga_caddy_data:
  goonginga_caddy_config:
