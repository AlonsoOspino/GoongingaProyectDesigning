services:
  database:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - goonginga_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    volumes:
      - ./media:/app/uploads
    environment:
      PORT: 3000
      MEDIA_DIR: /app/uploads
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${GOON_API_BIND_ADDRESS:-127.0.0.1}:${GOON_API_PORT:-3000}:3000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Set NEXT_PUBLIC_API_BASE_URL in .env}
    depends_on:
      - backend
    env_file:
      - frontend/.env
    environment:
      MEDIA_DIR: /app/uploads
    volumes:
      - ./media:/app/uploads
    restart: unless-stopped
    ports:
      - "${GOON_FRONTEND_BIND_ADDRESS:-127.0.0.1}:${GOON_FRONTEND_PORT:-3001}:3001"

  caddy:
    image: caddy:2-alpine
    environment:
      GOON_DOMAIN: ${GOON_DOMAIN:?Set GOON_DOMAIN in .env}
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - goonginga_caddy_data:/data
      - goonginga_caddy_config:/config
    restart: unless-stopped

volumes:
  goonginga_postgres_data:
  goonginga_caddy_data:
  goonginga_caddy_config:
